version: 2

updates:
  # Security updates only. A limit of 0 turns off routine version updates, while
  # Dependabot still opens security pull requests. The "Release security updates"
  # workflow merges each one once CI passes and publishes the next patch tag.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    groups:
      # One pull request, and so one release, for all fixes found at once.
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Wodby runs etcd 3.6; a newer client line needs a reviewed change.
      - dependency-name: go.etcd.io/etcd/*
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
